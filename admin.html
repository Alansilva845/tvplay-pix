<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TVPlay • Painel</title><style>
body{font-family:Arial;background:#10182d;color:#fff;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}h1{margin-bottom:6px}
.card{background:#18223e;padding:18px;border-radius:14px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
small{color:#aab5cc}button{border:0;border-radius:8px;padding:10px 13px;background:#3478f6;color:#fff;font-weight:700}
.paid{color:#5ee0a0}.pending{color:#ffd36b}.activated{color:#79b5ff}
</style></head><body><div class="wrap"><h1>TVPlay — Pagamentos</h1><div id="list">Carregando...</div></div>
<script>
async function load(){const r=await fetch("/api/admin/orders");const a=await r.json();list.innerHTML=a.length?a.map(o=>`
<div class="card"><div class="row"><div><b>${esc(o.name)}</b><br><small>${esc(o.whatsapp)} • ${esc(o.email)}</small></div>
<div>R$ ${Number(o.amount).toFixed(2).replace(".",",")}<br><small>${new Date(o.createdAt).toLocaleString("pt-BR")}</small></div></div>
<p>Status: <b class="${o.status}">${o.status}</b></p>${o.status==="approved"?`<button onclick="activate('${o.id}')">Marcar como ativado</button>`:""}</div>`).join(""):"Nenhum pedido.";
}
async function activate(id){await fetch("/api/admin/orders/"+id+"/activate",{method:"POST"});load()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[m]))}
load();setInterval(load,10000);
</script></body></html>
